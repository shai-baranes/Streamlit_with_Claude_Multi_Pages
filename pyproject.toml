[project]
name = "streamlit-with-claude-multi-pages"
version = "0.2.0"
description = "Session-isolated engineering CSV analytics"
readme = "README_GPT.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.60,<2", "pandas>=3.0,<4", "numpy>=2,<3",
  "plotly>=6,<7", "pyarrow>=24,<27", "streamlit-aggrid>=1.2.1.post2,<2",
  "matplotlib>=3.10,<4", "psutil>=6,<8",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "psutil>=6,<8"]
legacy-tools = ["selenium>=4,<5", "tkinterdnd2>=0.4,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
